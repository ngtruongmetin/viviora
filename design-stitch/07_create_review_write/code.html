<style>
        body {

            background-image: radial-gradient(theme('colors.on-surface-variant') 1px, transparent 1px);
            background-size: 20px 20px;
        }
        
        .neo-brutalist-border {

        .neo-brutalist-shadow {
            box-shadow: theme('spacing.shadow-offset') theme('spacing.shadow-offset') 0px 0px theme('colors.on-background');
        }
        
        .neo-brutalist-shadow-modal {
            box-shadow: 8px 8px 0px 0px theme('colors.on-background');
        }

        .neo-brutalist-button:active {
            transform: translate(theme('spacing.shadow-offset'), theme('spacing.shadow-offset'));
            box-shadow: none;
        }

        /* Custom Toggle Styling */
        .toggle-checkbox:checked {
            right: 0;
            border-color: theme('colors.on-background');
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #CCFF00;
        }
        .toggle-label {
            width: 48px;
            height: 24px;
            background-color: theme('colors.surface-variant');
            border-radius: 9999px;
            position: relative;
            cursor: pointer;
            border: theme('spacing.border-width') solid theme('colors.on-background');
            transition: background-color 0.2s ease-in-out;
        }
        .toggle-checkbox {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }
        .toggle-circle {
            position: absolute;
            top: -3px;
            left: -3px;
            width: 24px;
            height: 24px;
            background-color: theme('colors.on-primary');
            border: theme('spacing.border-width') solid theme('colors.on-background');
            border-radius: 50%;
            transition: transform 0.2s ease-in-out;
        }
        .toggle-checkbox:checked ~ .toggle-circle {
            transform: translateX(24px);
        }
    </style>

<script>
        // Simple script to handle star rating interactivity for demonstration
        document.addEventListener('DOMContentLoaded', () => {
            const stars = document.querySelectorAll('#star-rating button');
            
            stars.forEach((star, index) => {
                star.addEventListener('click', () => {
                    stars.forEach((s, i) => {
                        const icon = s.querySelector('span');
                        if (i <= index) {
                            icon.style.fontVariationSettings = "'FILL' 1";
                            icon.classList.remove('text-surface-variant');
                            icon.classList.add('text-on-background');
                        } else {
                            icon.style.fontVariationSettings = "'FILL' 0";
                            icon.classList.add('text-surface-variant');
                            icon.classList.remove('text-on-background');
                        }
                    });
                });
            });
        });
    </script>
