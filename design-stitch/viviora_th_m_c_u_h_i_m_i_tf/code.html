<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Add True/False Question</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Narrow:ital,wght@0,400..700;1,400..700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Anton:wght@100..900&family=Archivo+Narrow:wght@100..900&family=Space+Mono:wght@100..900&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "error": "#ba1a1a",
                        "on-secondary-fixed": "#1d1d00",
                        "primary-container": "#2d5bff",
                        "surface-bright": "#f9f9f9",
                        "on-primary-fixed": "#001355",
                        "surface-variant": "#e2e2e2",
                        "tertiary-fixed": "#ffdad2",
                        "tertiary-container": "#ce3000",
                        "on-tertiary-fixed": "#3c0700",
                        "surface-container-high": "#e8e8e8",
                        "primary-fixed": "#dde1ff",
                        "outline": "#747688",
                        "on-error": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "on-surface-variant": "#434656",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-container": "#efefff",
                        "primary-fixed-dim": "#b8c3ff",
                        "surface-dim": "#dadada",
                        "surface-container-low": "#f3f3f3",
                        "secondary": "#626200",
                        "secondary-fixed-dim": "#cdcd00",
                        "surface-tint": "#104af0",
                        "outline-variant": "#c4c5d9",
                        "on-secondary-container": "#666600",
                        "error-container": "#ffdad6",
                        "on-secondary-fixed-variant": "#494900",
                        "on-tertiary-container": "#ffece8",
                        "inverse-on-surface": "#f1f1f1",
                        "primary": "#0040df",
                        "on-surface": "#1b1b1b",
                        "tertiary-fixed-dim": "#ffb4a2",
                        "secondary-container": "#e7e700",
                        "on-secondary": "#ffffff",
                        "background": "#f9f9f9",
                        "inverse-surface": "#303030",
                        "tertiary": "#a32400",
                        "surface": "#f9f9f9",
                        "secondary-fixed": "#eaea00",
                        "on-primary": "#ffffff",
                        "inverse-primary": "#b8c3ff",
                        "on-primary-fixed-variant": "#0035bd",
                        "surface-container-highest": "#e2e2e2",
                        "on-tertiary-fixed-variant": "#8a1d00",
                        "on-background": "#1b1b1b",
                        "surface-container": "#eeeeee",
                        "on-error-container": "#93000a"
                    },
                    borderRadius: {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    spacing: {
                        "gutter": "16px",
                        "margin-desktop": "40px",
                        "margin-mobile": "16px",
                        "border-width": "3px",
                        "unit": "4px",
                        "shadow-offset": "4px"
                    },
                    fontFamily: {
                        "display-xl": ["Anton"],
                        "body-md": ["Archivo Narrow"],
                        "headline-md": ["Anton"],
                        "body-lg": ["Archivo Narrow"],
                        "metadata": ["Archivo Narrow"],
                        "headline-lg": ["Anton"],
                        "headline-lg-mobile": ["Anton"],
                        "label-mono": ["Space Mono"]
                    },
                    fontSize: {
                        "display-xl": ["80px", { "lineHeight": "80px", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "body-lg": ["20px", { "lineHeight": "30px", "fontWeight": "400" }],
                        "metadata": ["14px", { "lineHeight": "18px", "fontWeight": "600" }],
                        "headline-lg": ["48px", { "lineHeight": "48px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["32px", { "lineHeight": "32px", "fontWeight": "400" }],
                        "label-mono": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .neo-border {
            border: 3px solid #1b1b1b;
        }
        .neo-shadow {
            box-shadow: 4px 4px 0px 0px #1b1b1b;
        }
        .neo-shadow-lg {
            box-shadow: 8px 8px 0px 0px #1b1b1b;
        }
        .neo-shadow-focus:focus-within {
            box-shadow: 4px 4px 0px 0px #0040df;
        }
        .neo-button:active {
            transform: translate(4px, 4px);
            box-shadow: none;
        }
        .dot-pattern {
            background-image: radial-gradient(#1b1b1b 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>
</head>
<body class="bg-background font-body-md text-on-background antialiased h-screen w-screen overflow-hidden flex items-center justify-center relative dot-pattern">
<!-- Dimmed Background Image -->
<div class="absolute inset-0 z-0">
<img alt="Background Question Bank" class="w-full h-full object-cover opacity-30 grayscale blur-sm" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBeNz2x99Hv4qIUeUWEHQea3NP1i1wg0gxovxw_sqvkicWEFsTiHyto1agoZX5V07lmtYMSXoPR_YyDux5Y07QkpCuigH8Omn6v_uklW4CvefzPoXXE92I3eZPBTRQNYfeY7Or-O1T3ZBo8aIX28cx2gS_Mjx7O2_x45NmTDzg0yUsi175HROwpi_NuvaTxul_He6P2NVpRSlQRSTbbpfufQiES4OoyH2Gjb30vLPePoTfd21Dch5qyzA"/>
</div>
<div class="absolute inset-0 bg-surface/60 z-0"></div>
<!-- Modal Container -->
<div class="relative z-10 w-[90%] max-w-[800px] bg-surface neo-border neo-shadow-lg flex flex-col h-[90vh] md:h-auto max-h-[90vh]">
<!-- Header -->
<div class="flex justify-between items-center p-gutter border-b-[3px] border-on-background bg-secondary-fixed">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg uppercase text-on-secondary-fixed tracking-tight">Thêm Câu Hỏi</h1>
<button aria-label="Close" class="neo-border bg-surface w-10 h-10 flex items-center justify-center neo-shadow hover:bg-error hover:text-on-error neo-button transition-colors">
<span class="material-symbols-outlined font-headline-md">close</span>
</button>
</div>
<!-- Scrollable Content -->
<div class="p-gutter flex-1 overflow-y-auto space-y-8 bg-surface">
<!-- Type Selector -->
<div class="flex flex-col md:flex-row gap-4">
<button class="flex-1 p-3 neo-border bg-surface text-on-surface font-label-mono text-label-mono uppercase hover:bg-surface-variant transition-colors flex items-center justify-center gap-2">
<span class="material-symbols-outlined">format_list_bulleted</span>
                    MC — Trắc Nghiệm
                </button>
<button class="flex-1 p-3 neo-border bg-primary text-on-primary font-label-mono text-label-mono uppercase neo-shadow flex items-center justify-center gap-2">
<span class="material-symbols-outlined">check_circle</span>
                    TF — Đúng / Sai
                </button>
</div>
<!-- Form Fields -->
<div class="space-y-6">
<!-- Mệnh đề -->
<div class="space-y-2">
<label class="block font-headline-md text-headline-md uppercase text-on-background">Mệnh Đề</label>
<div class="neo-border bg-surface neo-shadow-focus transition-shadow">
<textarea class="w-full bg-transparent border-none p-4 font-body-lg text-body-lg text-on-background placeholder:text-outline placeholder:font-body-md focus:ring-0 resize-none h-32" placeholder="Nhập mệnh đề cần kiểm tra tại đây..."></textarea>
</div>
</div>
<!-- Đáp án đúng -->
<div class="space-y-2">
<label class="block font-headline-md text-headline-md uppercase text-on-background">Đáp Án Đúng</label>
<div class="grid grid-cols-2 gap-4">
<label class="cursor-pointer relative">
<input class="peer sr-only" name="tf_answer" type="radio" value="true"/>
<div class="neo-border bg-surface p-4 flex items-center justify-center gap-2 peer-checked:bg-[#CCFF00] peer-checked:neo-shadow hover:bg-surface-container-high transition-all h-16">
<span class="material-symbols-outlined font-bold text-on-background">check</span>
<span class="font-headline-md text-headline-md uppercase text-on-background">Đúng</span>
</div>
</label>
<label class="cursor-pointer relative">
<input class="peer sr-only" name="tf_answer" type="radio" value="false"/>
<div class="neo-border bg-surface p-4 flex items-center justify-center gap-2 peer-checked:bg-error peer-checked:text-on-error peer-checked:neo-shadow hover:bg-surface-container-high transition-all h-16">
<span class="material-symbols-outlined font-bold peer-checked:text-on-error">close</span>
<span class="font-headline-md text-headline-md uppercase peer-checked:text-on-error">Sai</span>
</div>
</label>
</div>
</div>
<!-- Giải thích -->
<div class="space-y-2">
<label class="block font-headline-md text-headline-md uppercase text-on-background flex items-center gap-2">
                        Giải Thích Đáp Án
                        <span class="font-label-mono text-label-mono text-outline lowercase tracking-normal">(Tùy chọn)</span>
</label>
<div class="neo-border bg-surface neo-shadow-focus transition-shadow">
<textarea class="w-full bg-transparent border-none p-4 font-body-md text-body-md text-on-background placeholder:text-outline focus:ring-0 resize-none h-24" placeholder="Giải thích vì sao mệnh đề trên là đúng hoặc sai..."></textarea>
</div>
</div>
</div>
</div>
<!-- Footer Actions -->
<div class="p-gutter border-t-[3px] border-on-background bg-surface-bright flex justify-end gap-4 mt-auto">
<button class="px-6 py-3 font-label-mono text-label-mono uppercase bg-surface text-on-surface neo-border hover:bg-surface-variant transition-colors neo-button">
                Hủy
            </button>
<button class="px-8 py-3 font-headline-md text-headline-md uppercase bg-primary text-on-primary neo-border neo-shadow hover:bg-surface-tint transition-colors neo-button flex items-center gap-2">
<span class="material-symbols-outlined">save</span>
                Lưu Câu Hỏi
            </button>
</div>
</div>
</body></html>
