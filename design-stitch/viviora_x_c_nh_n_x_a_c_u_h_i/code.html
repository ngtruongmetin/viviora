<body class="bg-background text-on-background bg-dots min-h-screen relative overflow-hidden">
<!-- Background Content (Simulated) -->
<div class="p-margin-desktop opacity-50 pointer-events-none select-none blur-[2px]">
<div class="w-full h-32 bg-surface-container-high border-border-width border-on-background mb-gutter shadow-[4px_4px_0_0_#1b1b1b]"></div>

<div class="col-span-3 h-96 bg-surface-bright border-border-width border-on-background shadow-[4px_4px_0_0_#1b1b1b]"></div>
<div class="col-span-9 h-96 bg-surface border-border-width border-on-background shadow-[4px_4px_0_0_#1b1b1b]"></div>
</div>
</div>
<!-- Modal Overlay Backdrop -->
<div class="fixed inset-0 bg-on-background/40 z-40 flex items-center justify-center p-margin-mobile md:p-margin-desktop">
<!-- Modal Container (Neo-Brutalist) -->
<div aria-labelledby="modal-title" aria-modal="true" class="bg-surface border-border-width border-on-background shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] w-full max-w-md flex flex-col relative z-50 transform transition-transform hover:-translate-y-1 hover:-translate-x-1 duration-200" role="dialog">
<!-- Modal Header (Red Top Bar) -->
<div class="bg-error border-b-border-width border-on-background p-4 flex items-center justify-between">
<div class="flex items-center gap-2 text-on-error">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">warning</span>
<h2 class="font-headline-md text-headline-md uppercase tracking-wide m-0" id="modal-title">XÓA CÂU HỎI?</h2>
</div>
<button aria-label="Close modal" class="text-on-error hover:text-on-background transition-colors active:translate-y-1 active:translate-x-1">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Modal Body -->
<div class="p-6 bg-surface-bright">
<p class="font-body-lg text-body-lg text-on-background mb-0">
                    Bạn có chắc chắn muốn xóa câu hỏi này? Hành động này không thể hoàn tác.
                </p>
<!-- Decorative element -->
<div class="w-full h-2 bg-[repeating-linear-gradient(45deg,#1b1b1b_0,#1b1b1b_2px,transparent_2px,transparent_8px)] mt-6 opacity-30"></div>
</div>
<!-- Modal Actions -->
<div class="p-6 border-t-border-width border-on-background bg-surface-container flex flex-col sm:flex-row justify-end gap-4">
<!-- Neutral/Cancel Button -->
<button class="bg-surface-lowest text-on-background font-headline-md text-headline-md uppercase border-border-width border-on-background shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] px-6 py-2 hover:bg-surface-variant active:translate-x-[4px] active:translate-y-[4px] active:shadow-none transition-all w-full sm:w-auto text-center">
                    HỦY
                </button>
<!-- Destructive/Delete Button -->
<button class="bg-error text-on-error font-headline-md text-headline-md uppercase border-border-width border-on-background shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] px-6 py-2 hover:bg-tertiary-container active:translate-x-[4px] active:translate-y-[4px] active:shadow-none transition-all w-full sm:w-auto text-center">
