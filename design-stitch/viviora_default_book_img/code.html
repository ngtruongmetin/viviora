<style>

        .cover-bg {
            position: relative;
            background-color: #fff;
            overflow: hidden;
            z-index: 1;
        }

        .cover-bg::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: radial-gradient(circle, #000 2px, transparent 2.5px);
            background-size: 16px 16px;
            z-index: -2;
        }
        
        .geo-shape-blue {
            position: absolute;
            background-color: #2D5BFF;
            z-index: -1;
        }

        .geo-shape-yellow {
            position: absolute;
            background-color: #FFE600;
            z-index: -1;
        }
        
        /* Simulating barcode */
        .barcode {
            background: repeating-linear-gradient(
                90deg,
                #000,
                #000 2px,
                transparent 2px,
                transparent 4px,
                #000 4px,
                #000 5px,
