<!-- Main Content Area -->
<main class="flex-1 ml-0 md:ml-64 p-margin-mobile md:p-margin-desktop flex items-center justify-center min-h-screen">

<div class="w-full max-w-3xl bg-surface-container-lowest border-[3px] border-on-background shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] flex flex-col">
<!-- Header -->

<h2 class="font-headline-lg text-headline-lg-mobile md:text-headline-lg uppercase m-0">THÊM THÀNH VIÊN MỚI</h2>
<button class="text-on-primary-container hover:text-on-background transition-colors">
<span class="material-symbols-outlined text-3xl">close</span>
</button>
</div>
<!-- Form Body -->
<div class="p-8 flex flex-col gap-6">
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<!-- Họ và tên -->
<div class="flex flex-col gap-2">
<label class="font-label-mono text-label-mono uppercase text-on-background" for="fullname">Họ và tên</label>

</div>
<!-- Username -->
<div class="flex flex-col gap-2">
<label class="font-label-mono text-label-mono uppercase text-on-background" for="username">Username</label>
<input class="w-full bg-surface-container-lowest border-[3px] border-on-background p-3 font-body-md text-on-background placeholder:text-outline placeholder:opacity-60 neo-input transition-shadow rounded-none" id="username" placeholder="Nhập username..." type="text">
</div>
</div>
<!-- Email -->
<div class="flex flex-col gap-2">
<label class="font-label-mono text-label-mono uppercase text-on-background" for="email">Email</label>

</div>

<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-background hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>

<div class="h-[3px] bg-on-background w-full my-2"></div>

<option selected="" value="student">Học sinh</option>
<option value="teacher">Giáo viên</option>
<option value="admin">Admin</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none">arrow_drop_down</span>
</div>
</div>
<!-- Lớp (Hiển thị khi chọn Học sinh) -->
<div class="flex flex-col gap-2" id="class-selection"><label class="font-label-mono text-label-mono uppercase text-on-background">LỚP</label>
<input class="w-full bg-surface-container-lowest border-[3px] border-on-background p-3 font-body-md text-on-background placeholder:text-outline placeholder:opacity-60 neo-input transition-shadow rounded-none" placeholder="Ví dụ: 7A1" type="text" value="7A1">
<p class="font-label-mono text-label-mono text-outline mt-1">Nhập tên lớp trực tiếp (ví dụ: 7A1, 10B2)</p></div><div class="flex flex-col gap-2 hidden" id="teacher-department">

<option value="Ngữ Văn">Ngữ Văn</option>
<option value="Tiếng Anh">Tiếng Anh</option>
<option value="Khoa học tự nhiên - Công nghệ">Khoa học tự nhiên - Công nghệ</option>
<option value="Lịch sử - Địa lí - Giáo dục công dân">Lịch sử - Địa lí - Giáo dục công dân</option>

<option value="Văn phòng">Văn phòng</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none">arrow_drop_down</span>

                </button>
<button class="bg-primary text-on-primary border-[3px] border-on-background font-headline-md text-headline-md px-8 py-3 neo-shadow-hover neo-shadow-active uppercase tracking-wide">
                    LƯU THÀNH VIÊN
                </button>
</div>

<script>
        // Simple script to demonstrate role selection toggling the class field (though visually it's already shown per prompt)
        const roleSelect = document.getElementById('role');
        const classSelection = document.getElementById('class-selection');

        roleSelect.addEventListener('change', (e) => {
            if (e.target.value === 'student') {
                classSelection.style.opacity = '1';
                classSelection.style.pointerEvents = 'auto';
            } else {
                classSelection.style.opacity = '0.3';
                classSelection.style.pointerEvents = 'none';
            }
        });
    </script>
